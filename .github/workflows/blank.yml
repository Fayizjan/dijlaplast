name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Ionic and Capacitor CLI
        run: npm install -g @capacitor/cli @capacitor/core

      - name: Create Ionic Project Structure
        run: |
          npx @capacitor/cli create my-app com.example.app --web-dir . --no-git
          cd my-app
          # نقل ملف ال إلى مجلد الويب الخاص بالمشروع
          mkdir -p www
          cp ../index.html www/index.html
          
          # إضافة منصة الأندرويد
          npm install @capacitor/android
          npx cap add android
          
          # بناء ملف الـ APK
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: my-app/android/app/build/outputs/apk/debug/app-debug.apk
