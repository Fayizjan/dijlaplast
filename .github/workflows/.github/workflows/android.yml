name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Simple APK
        run: |
          mkdir -p output/app/src/main/assets output/app/src/main/java/com/example/app output/app/src/main/res/values
          
          # نسخ ملف الـ HTML الخاص بك ليقرأه التطبيق محلياً
          if [ -f "index.html" ]; then
            cp index.html output/app/src/main/assets/index.html
          else
            echo "<html><body><h1>Hello App</h1></body></html>" > output/app/src/main/assets/index.html
          fi

          # ملفات الأندرويد الأساسية لتشغيل الـ WebView
          cat << 'EOF' > output/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="My HTML App" android:icon="@mipmap/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > output/app/src/main/java/com/example/app/MainActivity.java
          package com.example.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setAllowFileAccess(true);
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          cat << 'EOF' > output/build.gradle
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF

          cat << 'EOF' > output/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.app'
              compileSdk 33
              defaultConfig {
                  applicationId 'com.example.app'
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > output/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "My App"
          include ':app'
          EOF

          cd output
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: output/app/build/outputs/apk/debug/app-debug.apk
          
